allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - miniflare@5.20261019.1-beta
  - wrangler@4.151.3
  - workerd@1.20261019.1
  - '@cloudflare/workerd-darwin-64@1.20261019.1'
  - '@cloudflare/workerd-darwin-arm64@1.20261019.1'
  - '@cloudflare/workerd-linux-64@1.20261019.1'
  - '@cloudflare/workerd-linux-arm64@1.20261019.1'
  - '@cloudflare/workerd-windows-64@1.20261019.1'
  - '@cloudflare/vitest-pool-workers@0.23.0'
  - '@cloudflare/workers-types@5.20260818.1'
  - vite@6.4.4
overrides:
  # vitest-pool-workers pins an older wrangler and miniflare (workerd 2026-08-15), which cannot run a 2026-10-01 compatibility date; use the same runtime as the deploy tool.
  wrangler: 4.151.3
  miniflare: 5.20261019.1-beta
  nanoid: ^3.3.18
  postcss: ^8.5.23
  sharp: ^0.35.5
  esbuild: ^0.25.0
  # GHSA-3wwx-pv8p-q78v: miniflare pins undici 7.29.0 exactly; force the fixed release.
  undici: 7.29.1
  # GHSA-68fv-2mgg-jv7q: source-map-js < 1.2.2 (event-loop DoS); pulled in by postcss and magicast.
  source-map-js: 1.2.2
  # GHSA-587h-7wmj-h5pm and two related advisories: vite <= 6.4.3 bundles a vulnerable dev-server editor opener (Windows only); force the fixed release.
  vite: 6.4.4
  # GHSA-mrhx-c7xc-m3w5: vitest-pool-workers pins zod 4.4.3 exactly (memory exhaustion on oversized collections); force the patched release.
  zod: 4.6.6
patchedDependencies:
  postgres@3.4.9: patches/postgres@3.4.9.patch
