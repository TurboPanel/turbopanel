# Vestigial Automatic Analysis config. CI uses sonar-project.properties instead.
# Keep Automatic Analysis off for turbopanel_turbopanel so build.yml can scan
# with SONAR_TOKEN + Vitest & Deno LCOV. While Automatic Analysis is enabled,
# sonar-project.properties is ignored and the CI scanner fails.
#
# Scope here is kept in sync with sonar-project.properties only as a safety net
# if Automatic Analysis is re-enabled by mistake.

# Match the TurboPanel vendored Python pin (daemon PYTHON_VERSION).
sonar.python.version=3.14

# Keep in step with sonar-project.properties (co-located tests + helpers).
sonar.sources=src,mailer
sonar.tests=src,mailer
sonar.test.inclusions=\
  **/*.test.ts,\
  **/test-fixtures/**,\
  **/authn-hostfree-doubles.ts,\
  **/server-status-test-db.ts,\
  **/fake-redis-cell-client.ts,\
  **/workers-vitest.ts,\
  **/vitest-env.d.ts

sonar.exclusions=\
  dist/**,\
  node_modules/**,\
  .wrangler/**,\
  coverage/**,\
  logs/**,\
  certs/**,\
  .local/**,\
  .cache/**,\
  .config/**,\
  **/migrations/**

# Hand-authored OpenAPI JSON Schema is intentionally repetitive across resources;
# CPD on those files is noise, not a maintainability signal.
sonar.cpd.exclusions=\
  **/src/client/openapi/**,\
  **/src/daemon/openapi/**

sonar.coverage.exclusions=\
  dist/**,\
  node_modules/**,\
  .wrangler/**,\
  **/*.test.ts,\
  **/test-fixtures/**,\
  **/authn-hostfree-doubles.ts,\
  **/server-status-test-db.ts,\
  **/fake-redis-cell-client.ts,\
  **/workers-vitest.ts,\
  **/vitest-env.d.ts,\
  **/migrations/**
