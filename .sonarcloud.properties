# SonarCloud Automatic Analysis config (CI uses sonar-project.properties instead).
# While Automatic Analysis is enabled, sonar-project.properties is ignored.
# Keep Drizzle-generated SQL out of analysis — do not copy rules into migrations/.

sonar.exclusions=\
  dist/**,\
  node_modules/**,\
  .wrangler/**,\
  coverage/**,\
  logs/**,\
  certs/**,\
  .local/**,\
  .cache/**,\
  .config/**,\
  **/migrations/**

sonar.coverage.exclusions=\
  dist/**,\
  node_modules/**,\
  .wrangler/**,\
  **/*.test.ts,\
  **/migrations/**
