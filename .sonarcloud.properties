# SonarCloud Automatic Analysis config (CI uses sonar-project.properties instead).
# While Automatic Analysis is enabled, sonar-project.properties is ignored.
# Keep Drizzle-generated SQL out of analysis — do not copy rules into migrations/.

# Match the TurboPanel vendored Python pin (daemon PYTHON_VERSION).
sonar.python.version=3.14

sonar.exclusions=\
  dist/**,\
  node_modules/**,\
  .wrangler/**,\
  coverage/**,\
  logs/**,\
  certs/**,\
  .local/**,\
  .cache/**,\
  .config/**,\
  **/migrations/**

# Hand-authored OpenAPI JSON Schema is intentionally repetitive across resources;
# CPD on those files is noise, not a maintainability signal.
sonar.cpd.exclusions=\
  **/src/client/openapi/**,\
  **/src/daemon/openapi/**

sonar.coverage.exclusions=\
  dist/**,\
  node_modules/**,\
  .wrangler/**,\
  **/*.test.ts,\
  **/migrations/**
