sonar.projectKey=turbopanel_turbopanel
sonar.projectName=turbopanel
sonar.organization=turbopanel

# CI-based analysis via .github/workflows/build.yml (SONAR_TOKEN). Automatic
# Analysis must stay off for this project (SonarCloud → Administration →
# Analysis Method); otherwise the CI scanner fails.

# Match the TurboPanel vendored Python pin (daemon PYTHON_VERSION).
sonar.python.version=3.14

# Vitest + Deno LCOV from `pnpm test:coverage` (scripts/test-coverage.sh).
# scripts/test-coverage.sh merges Workers-pool Istanbul coverage
# (coverage/vitest/lcov.info — Durable Object / Workers-only code) with Deno
# V8 coverage (coverage/deno.lcov) into coverage/lcov.info so SonarCloud
# imports a single repo-relative report. javascript.lcov covers both JS and TS.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Co-located tests (*.test.ts next to sources). Same roots for sources and
# tests + test.inclusions — do not leave sonar.tests unset (scanner then
# falls back to filename/directory heuristics and mis-classifies helpers
# such as test-fixtures/ and *-hostfree-doubles.ts as main code).
sonar.sources=src,mailer
sonar.tests=src,mailer
sonar.test.inclusions=\
  **/*.test.ts,\
  **/test-fixtures/**,\
  **/authn-hostfree-doubles.ts,\
  **/server-status-test-db.ts,\
  **/fake-redis-cell-client.ts,\
  **/workers-vitest.ts,\
  **/vitest-env.d.ts

sonar.exclusions=\
  dist/**,\
  node_modules/**,\
  .wrangler/**,\
  coverage/**,\
  logs/**,\
  certs/**,\
  .local/**,\
  .cache/**,\
  .config/**,\
  **/migrations/**,\
  THIRD_PARTY_NOTICES.md

# Hand-authored OpenAPI JSON Schema is intentionally repetitive across resources;
# CPD on those files is noise, not a maintainability signal.
sonar.cpd.exclusions=\
  **/src/client/openapi/**,\
  **/src/daemon/openapi/**

sonar.coverage.exclusions=\
  dist/**,\
  node_modules/**,\
  .wrangler/**,\
  **/*.test.ts,\
  **/test-fixtures/**,\
  **/authn-hostfree-doubles.ts,\
  **/server-status-test-db.ts,\
  **/fake-redis-cell-client.ts,\
  **/workers-vitest.ts,\
  **/vitest-env.d.ts,\
  **/migrations/**,\
  THIRD_PARTY_NOTICES.md

# Deno.test() and Vitest imports are not always recognized by Sonar analysis;
# S2187 ("Add some tests to this file") is a false positive on *.test.ts.
sonar.issue.ignore.multicriteria=denoS2187
sonar.issue.ignore.multicriteria.denoS2187.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.denoS2187.resourceKey=**/*.test.ts
