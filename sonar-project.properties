sonar.projectKey=turbopanel_turbopanel
sonar.projectName=turbopanel

sonar.exclusions=\
  dist/**,\
  node_modules/**,\
  .wrangler/**,\
  coverage/**,\
  logs/**,\
  certs/**,\
  .local/**,\
  .cache/**,\
  .config/**,\
  migrations/**

sonar.coverage.exclusions=\
  dist/**,\
  node_modules/**,\
  .wrangler/**,\
  **/*.test.ts

# Deno.test() and Vitest imports are not always recognized by Sonar analysis;
# S2187 ("Add some tests to this file") is a false positive on *.test.ts.
sonar.issue.ignore.multicriteria=denoS2187
sonar.issue.ignore.multicriteria.denoS2187.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.denoS2187.resourceKey=**/*.test.ts
