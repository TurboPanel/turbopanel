sonar.projectKey=turbopanel_turbopanel
sonar.projectName=turbopanel
sonar.organization=turbopanel

# CI-based analysis via .github/workflows/build.yml (SONAR_TOKEN). Automatic
# Analysis must stay off for this project (SonarCloud → Administration →
# Analysis Method); otherwise the CI scanner fails.

# Match the TurboPanel vendored Python pin (daemon PYTHON_VERSION).
sonar.python.version=3.14

# Vitest + Deno LCOV from `pnpm test:coverage` (scripts/test-coverage.sh).
# Vitest runs under @cloudflare/vitest-pool-workers (no V8 inspector) — LCOV is
# Deno-only. javascript.lcov covers both JS and TS. Requires CI-based analysis.
sonar.javascript.lcov.reportPaths=coverage/deno.lcov

sonar.exclusions=\
  dist/**,\
  node_modules/**,\
  .wrangler/**,\
  coverage/**,\
  logs/**,\
  certs/**,\
  .local/**,\
  .cache/**,\
  .config/**,\
  **/migrations/**

# Hand-authored OpenAPI JSON Schema is intentionally repetitive across resources;
# CPD on those files is noise, not a maintainability signal.
sonar.cpd.exclusions=\
  **/src/client/openapi/**,\
  **/src/daemon/openapi/**

sonar.coverage.exclusions=\
  dist/**,\
  node_modules/**,\
  .wrangler/**,\
  **/*.test.ts,\
  **/migrations/**

# Deno.test() and Vitest imports are not always recognized by Sonar analysis;
# S2187 ("Add some tests to this file") is a false positive on *.test.ts.
sonar.issue.ignore.multicriteria=denoS2187
sonar.issue.ignore.multicriteria.denoS2187.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.denoS2187.resourceKey=**/*.test.ts
