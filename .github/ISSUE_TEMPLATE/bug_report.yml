name: Bug report
description: Something is broken or behaves differently than the docs say
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Which part is affected?
      description: Issues for every TurboPanel repository are tracked here. Pick the closest match; we will re-label it if needed.
      options:
        - Control plane (this repository)
        - Daemon (turbopaneld)
        - Console UI
        - Website or docs
        - Dev tooling and release workflows
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown on the console's Updates screen, e.g. 0.1.3 or 0.1.4-canary.3
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: false
