# BREAK-GLASS promotion for this repo. The normal path is the two automatic
# PRs (promote-prs.yml -> publish-rc.yml, then publish-release.yml): merge "Release Candidate
# x.y.z-rc.N" to publish the next rc, merge "Release x.y.z" to ship it. Use this form
# only when those cannot run.
#
#   to=rc       canary build → v<base>-rc.<N> pre-release + `staging` branch
#   to=release  newest v<base>-rc.<N> → v<base> (releases/latest) + `live` branch
#
# The bytes are the tested build's; only the asset names, the manifest
# (version, channel, urls) and its signature change. Repos release
# independently — nothing here waits on another repo. The three jobs are
# TurboPanel/dev's reusable workflows pinned to ONE sha, passed again as
# dev-ref (that is where the scripts live). Approval = the `release`
# environment (prepare, then finalize). to=release needs the TurboPanel
# Release GitHub App (RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY) for the
# bare tag and the live push and refuses to start without it; to=rc works
# with GITHUB_TOKEN up to the staging push, which then says how to do it by
# hand until the App exists.

name: Promote

on:
  workflow_dispatch:
    inputs:
      to:
        description: Promote to
        required: true
        type: choice
        options:
          - rc
          - release
      source:
        description: 'to=rc: a canary build id (yyyymmdd-hhmmss-sha7 from the rolling canary release), a canary version, or manifest-<version>.json. to=release: the rc tag (vX.Y.Z-rc.N).'
        required: true
        type: string

# Read-only by default; each promote job asks for contents: write (tag,
# GitHub release, branch fast-forward). Bare tags and the live push use the
# Release App token inside TurboPanel/dev's workflows, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  prepare:
    uses: TurboPanel/dev/.github/workflows/gh-promote.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      repo-kind: instance
      to: ${{ inputs.to }}
      source: ${{ inputs.source }}
      dev-ref: d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
      # turbopaneld commit carrying scripts/sign-manifest.ts and the release
      # public-key pin. Bump it when the key is rotated.
      signer-ref: 93c4f94510c9499e6bf04366a9500fe9f8e38aaa
    permissions:
      contents: write # the rc tag
    secrets: inherit

  publish:
    needs: prepare
    uses: TurboPanel/dev/.github/workflows/gh-release.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: ${{ inputs.to }}
      release-notes: ${{ needs.prepare.outputs.release-notes }}
      assets-artifact-name: ${{ needs.prepare.outputs.assets-artifact-name }}
      manifest-filename: ${{ needs.prepare.outputs.manifest-filename }}
      target-commit: ${{ needs.prepare.outputs.commit }}
    permissions:
      contents: write # the GitHub (pre-)release + the rolling rc pointer
    secrets: inherit

  finalize:
    needs: [prepare, publish]
    uses: TurboPanel/dev/.github/workflows/gh-promote-finalize.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      to: ${{ inputs.to }}
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
      branch: ${{ needs.prepare.outputs.branch }}
      manifest-filename: ${{ needs.prepare.outputs.manifest-filename }}
    permissions:
      contents: write # release flags + staging/live fast-forward
    secrets: inherit
