# Publishes a GitHub Release on a v* tag: the compiled self-hosted instance,
# built natively on each architecture (no cross-compiling the DuckDB addon)
# and packaged once in CI as turbopanel-instance-<version>-<arch>.tar.zst —
# bin/turbopanel (the one binary: the server with the in-process email
# consumer, the migrations embedded and the install-time verbs migrate,
# generate-secret, generate-self-signed-cert) and lib/libduckdb.so (what
# instance-launch's compiled branch puts on LD_LIBRARY_PATH) — plus a
# manifest.json with the sha256 and size of each asset. The installer unpacks
# the package flat into /opt/turbopanel beside the daemon (bin/, lib/). The
# Caddy site config is not part of the package: the daemon's instance-launch
# role renders it from its own Caddyfile.j2. Road to 0.1.x, `artifacts-cp-ui`
# + `instance-runtime-packaging`; consuming the package is
# `self-hosted-installer`.
#
# Size: `deno compile` under BYONM embeds the whole node_modules tree, so the
# binary is compiled against a production-only install (pnpm --prod) after
# the type check has run against the full one — the dev tree (wrangler,
# workerd, vitest…) is most of the difference between ~480 MB and ~200 MB.
#
# Build (the Postgres-backed test suite and Sonar, ~25 min) is not re-run
# here: the tag must sit on a commit whose Build already went green — the
# prepare job checks that and refuses otherwise (dry runs too).
#
# The canary channel reuses this same build: canary.yml calls this workflow
# (workflow_call, channel=canary) after every green Build on trunk. The
# version then comes from git tags (TurboPanel/dev's Version From Tags
# action): the base X.Y.Z is the newest release's next patch, or a started /
# in-flight version, plus `-canary.<N>` with N restarting at 1 for each base.
# The packages go to the rolling `canary` pre-release through TurboPanel/dev's
# gh-canary.yml instead of a versioned release.
#
# Whatever the path, the binary reports the plain base X.Y.Z: it is stamped
# into this checkout's deno.json (and package.json) before compiling, so
# deno.json's committed number is only what a local build reports.
#
# Each binary is smoke-tested before it is packaged: the `duckdb-smoke`
# subcommand opens embedded DuckDB with the permission shape the binary
# ships, against the vendored .so — the same gate `deno task duckdb:smoke`
# runs in the dev guest.

name: Release

on:
  push:
    # v[0-9]* (not v*) so a dry-run dispatch's own tag (e.g. vtest-workflow-0,
    # created by gh release create with no matching pre-existing tag) can't
    # re-trigger this same workflow via the tag-push path.
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release without a leading v (e.g. test-workflow-0 for a dry run -- avoid a leading digit so the tag doesn't match v[0-9]* and re-trigger this workflow)
        required: true
        type: string
      channel:
        description: Channel label for this release
        required: true
        type: string
        default: rc
  workflow_call:
    inputs:
      channel:
        description: Only `canary` is meaningful here — the rolling trunk build
        required: true
        type: string
      ref:
        description: The trunk commit to build (the head of the green Build run)
        required: true
        type: string
    secrets:
      RELEASE_SIGNING_KEY:
        description: PKCS#8 PEM of the offline release key the manifest is signed with
        required: true

# Read-only by default. Writes: the `release` and `canary` jobs (the called
# TurboPanel/dev workflows create the GitHub release / update the rolling
# canary release and its tag). prepare also reads Actions runs.
permissions:
  contents: read

jobs:
  prepare:
    # A tag pushed by a `[bot]` actor is the TurboPanel Release App
    # promoting a tested build (promote.yml → TurboPanel/dev gh-promote.yml);
    # that flow publishes the release itself, so this from-source path must
    # not race it. A person pushing a tag still gets the classic from-source release; trunk
    # pushes (canary) are unaffected.
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # gh run list: the green Build for this commit
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      base: ${{ steps.resolve.outputs.base }}
      channel: ${{ steps.resolve.outputs.channel }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Work out the canary version from the tags
        id: canary
        if: inputs.channel == 'canary' && inputs.ref != ''
        uses: TurboPanel/dev/.github/actions/version@a903ecc40b8b27ce08dd3336497597f66c13d171 # dev#44
        with:
          mode: canary

      - name: Resolve version, channel and commit
        id: resolve
        env:
          CANARY_VERSION: ${{ steps.canary.outputs.version }}
          CANARY_BASE: ${{ steps.canary.outputs.base }}
        run: |
          set -eu
          _commit="$(git rev-parse HEAD)"
          echo "commit=${_commit}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.channel }}" = "canary" ] && [ -n "${{ inputs.ref }}" ]; then
            # The rolling trunk build: the base from the tags (what the binary
            # reports) plus a `-canary.<N>` pre-release suffix, so every asset
            # name is unique per build and semver orders it below the release
            # it leads to.
            case "$CANARY_VERSION" in
              *-canary.*) ;;
              *) echo "::error::no canary version worked out (got '${CANARY_VERSION}')"; exit 1 ;;
            esac
            echo "version=${CANARY_VERSION}" >> "$GITHUB_OUTPUT"
            echo "base=${CANARY_BASE}" >> "$GITHUB_OUTPUT"
            echo "channel=canary" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          else
            # A tag pushed by hand: its number is the version (stamped below,
            # not checked against deno.json — versions come from tags).
            _ref="${{ github.ref_name }}"
            echo "version=${_ref#v}" >> "$GITHUB_OUTPUT"
            echo "base=${_ref#v}" >> "$GITHUB_OUTPUT"
            echo "channel=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a green Build on this commit
        # Tag after green, encoded: the test suite and Sonar are not re-run
        # here, so the commit must already carry a successful Build — one that
        # tested this commit itself: a push run, or a manual (workflow_dispatch)
        # run. A pull_request run does not count: it tested the commit merged
        # into the PR's base (the trunk -> staging PR tests trunk + staging).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          set -eu
          _ok="$(gh run list --repo "$REPO" --workflow Build --commit "$COMMIT" --status success --json event --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")] | length')"
          if [ "${_ok:-0}" -lt 1 ]; then
            echo "::error::no successful push (or manual) Build run found for ${COMMIT} — tag a commit whose trunk Build is green"
            exit 1
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          # Native runners, one per architecture: `deno compile` bundles the
          # host's duckdb.node and scripts/duckdb-native-lib.ts locates the
          # host's libduckdb.so, so each package is built where it runs.
          - arch: linux-amd64
            runner: ubuntu-24.04
          - arch: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TP_ARCH: ${{ matrix.arch }}
      TP_VERSION: ${{ needs.prepare.outputs.version }}
      TP_BASE_VERSION: ${{ needs.prepare.outputs.base }}
      TP_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: Type-check the instance
        # The compile tasks run with --no-check (see
        # src/deno-compile-permissions.test.ts); this is where the check
        # happens, against the full dependency tree the toolchain step installed.
        run: deno check src/deno.ts

      - name: Prune to production dependencies
        # What gets embedded in the binary. Runtime deps only; the dev tree
        # (wrangler + workerd, vitest, drizzle-kit, esbuild) never ships.
        run: pnpm install --prod --frozen-lockfile --ignore-scripts

      - name: Stamp the build identity
        # The version: src/app/version.ts reads deno.json, so the base X.Y.Z
        # (never the -canary.N label) is written into deno.json and
        # package.json here; a dry run's throwaway version (not X.Y.Z) leaves
        # them alone. The commit is empty in source (BUILD_INFO in
        # src/app/build-info.ts) — it is what /api/health reports as the
        # Corresponding Source revision when no TURBOPANEL_REVISION env is
        # set. Transient in this checkout only.
        run: |
          set -eu
          case "$TP_BASE_VERSION" in
            [0-9]*.[0-9]*.[0-9]*)
              python3 - <<'PY'
          import json, os
          for path in ("deno.json", "package.json"):
              with open(path) as f:
                  config = json.load(f)
              config["version"] = os.environ["TP_BASE_VERSION"]
              with open(path, "w") as f:
                  json.dump(config, f, indent=2)
                  f.write("\n")
          PY
              echo "building ${TP_BASE_VERSION} (${TP_VERSION})"
              ;;
            *) echo "dry run ${TP_BASE_VERSION}: deno.json keeps its number" ;;
          esac
          grep -q "commit: ''," src/app/build-info.ts
          sed -i "s/commit: '',/commit: '${TP_COMMIT}',/" src/app/build-info.ts
          grep -q "commit: '${TP_COMMIT}'," src/app/build-info.ts

      - name: Compile the instance
        run: deno task compile

      - name: Locate libduckdb.so
        id: duckdb
        run: |
          set -eu
          _dir="$(deno run --allow-env --allow-read --allow-run scripts/duckdb-native-lib.ts)"
          test -f "${_dir}/libduckdb.so"
          echo "dir=${_dir}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the compiled binary against embedded DuckDB
        # The binary's --allow-write is baked to /var/lib/turbopanel/metrics,
        # so the scratch store has to live there even on a runner.
        run: |
          set -eu
          sudo mkdir -p /var/lib/turbopanel/metrics
          sudo chown -R "$(id -u):$(id -g)" /var/lib/turbopanel
          deno task duckdb:smoke --bin=dist/turbopanel

      - name: Report the binary's shape
        # `file` exits 1 on a deno-compiled binary (the eszip trailer confuses
        # its ELF parser) while still printing the architecture line — the
        # line is what we want, the exit code is noise.
        run: file dist/turbopanel || true

      - name: Package the release asset
        run: |
          set -eu
          _stage="$(mktemp -d)"
          mkdir -p "${_stage}/bin" "${_stage}/lib" release-assets
          install -m 0755 dist/turbopanel "${_stage}/bin/turbopanel"
          # The install-time verbs run without the vendored .so or a checkout.
          "${_stage}/bin/turbopanel" generate-secret | grep -Eq '^[A-Za-z0-9_]{48}$'
          install -m 0644 "${{ steps.duckdb.outputs.dir }}/libduckdb.so" "${_stage}/lib/libduckdb.so"
          _name="turbopanel-instance-${TP_VERSION}-${TP_ARCH}.tar.zst"
          tar -C "${_stage}" -cf - bin lib | zstd -19 -T0 -q -o "release-assets/${_name}"
          rm -rf "${_stage}"
          ls -l release-assets

      - name: Upload the release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbopanel-instance-${{ matrix.arch }}
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download both architectures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: turbopanel-instance-linux-*
          path: release-assets
          merge-multiple: true

      - name: Write the manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          # Tag-pinned, not releases/latest — a promotion landing between a
          # consumer's manifest fetch and its asset fetch must not 404 it. A
          # canary build points at the rolling release instead: its assets
          # carry the build id in their names, so they are never overwritten.
          ARTIFACT_BASE_URL: ${{ needs.prepare.outputs.channel == 'canary' && format('https://github.com/{0}/releases/download/canary', github.repository) || format('https://github.com/{0}/releases/download/v{1}', github.repository, needs.prepare.outputs.version) }}
        run: |
          set -eu
          ls -l release-assets
          python3 <<'PY'
          import hashlib, json, os, re, time
          version = os.environ["VERSION"]
          commit = os.environ["COMMIT"]
          artifacts = {}
          for arch in ("linux-amd64", "linux-arm64"):
              name = f"turbopanel-instance-{version}-{arch}.tar.zst"
              with open(os.path.join("release-assets", name), "rb") as f:
                  data = f.read()
              if not data:
                  raise SystemExit(f"empty release asset: {name}")
              artifacts[f"instance-{arch}"] = {
                  "url": f"{os.environ['ARTIFACT_BASE_URL']}/{name}",
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              }
          now = time.gmtime()
          # A pre-2026-09-28 canary version carries its build id; reuse it so the
          # manifest, the asset names and the release notes all agree. A
          # counter canary (`-canary.<run number>`) has none, so the id is
          # stamped from the clock and the commit.
          m = re.search(r"-canary\.(\d{8}-\d{6}-[0-9a-f]{7})$", version)
          build_id = m.group(1) if m else f"{time.strftime('%Y%m%d-%H%M%S', now)}-{commit[:7]}"
          manifest = {
              "schema": 1,
              "channel": os.environ["CHANNEL"],
              "version": version,
              "commit": commit,
              "buildId": build_id,
              "builtAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", now),
              "artifacts": artifacts,
          }
          with open("release-assets/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print(json.dumps(manifest, indent=2))
          PY

      # Sign the finished manifest with the offline release key, using the
      # daemon repo's signer (src/update/signing.ts) so every package has one
      # canonicaliser — the bytes run.sh and the daemon verify. The script
      # refuses a missing key and a key that does not match the public key
      # pinned in that checkout: never publish an unsigned manifest.
      - name: Check out the manifest signer (turbopaneld)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurboPanel/turbopaneld
          # turbopaneld trunk carrying scripts/sign-manifest.ts and the current
          # release public key pin. Bump it when the key is rotated.
          ref: 6d13d4652e7993a3cbba72232ae49edbf9037938
          path: .manifest-signer
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the runtime pin reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          # Its own path: a checkout at the workspace root would git-clean the
          # downloaded release-assets/ and the signer checkout.
          path: .pin-reader
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci-runtime-pins.sh
          sparse-checkout-cone-mode: false

      - name: Read the signer's Deno pin
        id: signer-pins
        run: echo "deno-version=$(sh .pin-reader/scripts/ci-runtime-pins.sh .manifest-signer deno)" >> "$GITHUB_OUTPUT"

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.signer-pins.outputs.deno-version }}

      - name: Sign the manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          deno run --config .manifest-signer/deno.json \
            --allow-read --allow-write=release-assets/manifest.json \
            --allow-env=RELEASE_SIGNING_KEY \
            .manifest-signer/scripts/sign-manifest.ts release-assets/manifest.json
          python3 -c 'import json; s = json.load(open("release-assets/manifest.json"))["signature"]; print("manifest signed:", s["alg"], "keyId", s["keyId"])'

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbopanel-instance-release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, manifest]
    if: needs.prepare.outputs.channel != 'canary'
    permissions:
      contents: write # gh-release.yml: tag + GitHub release + rolling rc pointer
    uses: TurboPanel/dev/.github/workflows/gh-release.yml@177d481666cce2e1dcfa76290b141b0149a6a0a9 # dev trunk 2026-09-25
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: ${{ needs.prepare.outputs.channel }}
      assets-artifact-name: turbopanel-instance-release-assets
      manifest-filename: manifest.json
      release-notes: 'See https://github.com/${{ github.repository }}/commits/v${{ needs.prepare.outputs.version }} for changes.'

  canary:
    needs: [prepare, manifest]
    if: needs.prepare.outputs.channel == 'canary'
    permissions:
      contents: write # gh-canary.yml: rolling `canary` release assets + tag move
    uses: TurboPanel/dev/.github/workflows/gh-canary.yml@a903ecc40b8b27ce08dd3336497597f66c13d171 # dev#44
    with:
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
      assets-artifact-name: turbopanel-instance-release-assets
      manifest-filename: manifest.json
