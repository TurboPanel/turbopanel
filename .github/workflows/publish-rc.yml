# Publishes the next x.y.z-rc.N when the trunk → staging PR is merged (Road to
# 0.2.x, versioning flow). Runs on the push the merge makes to staging — a push
# runs the workflow file from the pushed commit, so the very first merge (which
# brings this file into staging) already works.
#
#   1. resolve  the merged PR's head commit and the canary that was built from
#               it (waits for it if it is still building): the manifest copy on
#               the rolling canary release that names exactly that commit. Its
#               version (<base>-canary.<N>) came from tags, not a version file,
#               and the manifest copy's name is what gh-promote is handed.
#   2. prepare / publish / finalize   the shared promote workflows
#               (TurboPanel/dev) with NO approval gate — the merge was the
#               deliberate act; the rc is the canary's bytes re-signed
#   3. release-pr  opens (or refreshes) the staging → live PR "Release <version>"
#
# A push to staging that is not a merged trunk PR (a break-glass promotion, the
# finalize fast-forward) does nothing. workflow_dispatch re-runs it for a
# given trunk commit.

name: Publish Release Candidate

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      commit:
        description: Trunk commit whose canary becomes the next rc
        required: true
        type: string

# Read-only by default. Writes (contents: write) only in the three promote
# jobs: the rc tag, its GitHub pre-release + the rolling rc pointer, and the
# staging fast-forward. The staging -> live PR is opened with the Release
# App's token, not GITHUB_TOKEN, so no job needs pull-requests: write.
permissions:
  contents: read

concurrency:
  group: publish-rc
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # gh run list: the trunk Build of the merged commit
    outputs:
      proceed: ${{ steps.r.outputs.proceed }}
      commit: ${{ steps.r.outputs.commit }}
      canary: ${{ steps.r.outputs.canary }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - name: Find the merged PR, its canary build, and check they match
        id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PUSHED: ${{ github.sha }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then
            commit="$INPUT_COMMIT"
          else
            # Only a merged trunk → staging PR publishes an rc. The API can take a
            # moment to associate the merge commit with its PR.
            pr=""
            for _ in 1 2 3 4 5 6; do
              pr="$(gh api "repos/$REPO/commits/$PUSHED/pulls" --jq '[.[] | select(.base.ref == "staging" and .head.ref == "trunk" and .merged_at != null)][0].number // empty')"
              [ -n "$pr" ] && break
              sleep 10
            done
            if [ -z "$pr" ]; then
              echo "push to staging is not a merged trunk PR — nothing to publish"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            commit="$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)"
            echo "PR #$pr merged trunk commit $commit"
          fi

          # The canary build of that commit: the rolling `canary` release keeps
          # one signed manifest copy per build (manifest-<X.Y.Z>-canary.<N>.json)
          # and each names the commit it was built from. The build may still be
          # running (the PR can merge while the newest trunk commit is being
          # built) — wait, up to 45 minutes.
          manifest=""
          : > checked.txt
          for _ in $(seq 1 90); do
            gh release view canary --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null \
              | grep -E '^manifest-[0-9]+\.[0-9]+\.[0-9]+-canary\.[0-9]+\.json$' | sort -V -r > canary-assets.txt || true
            for name in $(cat canary-assets.txt); do
              grep -qx "$name" checked.txt && continue
              gh release download canary --repo "$REPO" --pattern "$name" --output candidate.json --clobber
              echo "$name" >> checked.txt
              if [ "$(jq -r .commit candidate.json)" = "$commit" ]; then
                manifest="$name"
                cp candidate.json manifest.json
                break
              fi
            done
            [ -n "$manifest" ] && break
            # A failed test run on that commit will never produce a canary. Push
          # runs only: a pull_request run tested a merge, not this commit.
            if [ "$(gh run list --repo "$REPO" --workflow build.yml --commit "$commit" --limit 10 --json event,conclusion --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].conclusion // empty')" = "failure" ]; then
              echo "::error::the Build of $commit failed, so it has no canary — fix trunk and re-run this workflow with workflow_dispatch"
              exit 1
            fi
            sleep 30
          done
          [ -n "$manifest" ] || { echo "::error::no canary built from $commit after 45 minutes (superseded by a newer trunk merge, or pruned — the rail keeps the newest 20). Re-run this workflow with workflow_dispatch for a commit that has one."; exit 1; }
          version="$(jq -r .version manifest.json | sed 's/-canary\..*$//')"

          # Idempotence: this commit already has an rc (a re-run) — do not publish rc.N+1 of the same bytes.
          for ref in $(gh api --paginate "repos/$REPO/git/matching-refs/tags/v$version-rc." --jq '.[].ref' | sed 's#^refs/tags/##'); do
            if [ "$(gh api "repos/$REPO/commits/$ref" --jq .sha)" = "$commit" ]; then
              echo "$ref already carries $commit — nothing to publish"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          {
            echo "proceed=true"
            echo "commit=$commit"
            echo "canary=$manifest"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "publishing an rc of $version from canary $manifest ($commit)"

  prepare:
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    uses: TurboPanel/dev/.github/workflows/gh-promote.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      repo-kind: instance
      to: rc
      source: ${{ needs.resolve.outputs.canary }}
      dev-ref: d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
      # Same signer pin as promote.yml.
      signer-ref: 93c4f94510c9499e6bf04366a9500fe9f8e38aaa
      # The merge of the promotion PR is the approval.
      approval-environment: ''
    permissions:
      contents: write # the v<x.y.z>-rc.<N> tag
    secrets: inherit

  publish:
    needs: prepare
    uses: TurboPanel/dev/.github/workflows/gh-release.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: rc
      release-notes: ${{ needs.prepare.outputs.release-notes }}
      assets-artifact-name: ${{ needs.prepare.outputs.assets-artifact-name }}
      manifest-filename: ${{ needs.prepare.outputs.manifest-filename }}
      target-commit: ${{ needs.prepare.outputs.commit }}
    permissions:
      contents: write # the GitHub pre-release + the rolling rc pointer
    secrets: inherit

  finalize:
    needs: [prepare, publish]
    uses: TurboPanel/dev/.github/workflows/gh-promote-finalize.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      to: rc
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
      branch: ${{ needs.prepare.outputs.branch }}
      manifest-filename: ${{ needs.prepare.outputs.manifest-filename }}
    permissions:
      contents: write # the staging fast-forward
    secrets: inherit

  release-pr:
    needs: [resolve, prepare, finalize]
    runs-on: ubuntu-latest
    steps:
      - name: Mint a Release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out the changelog script (TurboPanel/dev)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurboPanel/dev
          ref: d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
          path: .promote
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/promote
          sparse-checkout-cone-mode: false

      - name: Open or refresh the staging → live PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RC: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          existing="$(gh pr list --repo "$REPO" --base live --head staging --state open --json number --jq '.[0].number // empty')"
          {
            echo "Merging this publishes the release \`v$VERSION\` from \`v$RC\` (same bytes, re-signed) and moves \`live\`. It runs automatically after the merge (\`publish-release.yml\`)."
            echo
            echo "**Since the last release:**"
            echo
            sh .promote/scripts/promote/changelog.sh "$REPO" live staging 80
            echo
            echo "Merge with a merge commit (live takes merge commits only). Wait for \`ci-ok\` first."
          } > body.md
          title="Release $VERSION"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPO" --title "$title" --body-file body.md
          else
            gh pr create --repo "$REPO" --base live --head staging --title "$title" --body-file body.md
          fi
