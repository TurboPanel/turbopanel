name: Build

on:
  push:
    branches:
      - trunk
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Tests fan out, then one job named SonarQube merges LCOV and scans. The
# required check context must stay "SonarQube". A fan-in skipped because a
# shard failed would report success, so that job runs unless the workflow
# itself was cancelled and then fails unless every upstream result is success.
#
# cancel-in-progress is true on every verify-stage job, including trunk
# pushes: a newer commit on the same ref replaces the run already going.
# Each job has its own group. One shared group would queue the shards
# behind each other and cancel all but one of them.

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: instance-checks-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-migration-additions runs `git show <base>:migrations/manifest.json`.
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Durable Object hibernation guard
        run: pnpm run check:do-hibernation

      - name: Workers bundle check
        run: pnpm run check:workers-bundle

      - name: Check vocabulary (no daemon-as-agent phrasing)
        run: pnpm run check:vocabulary

      # Shipped migrations are immutable once the freeze manifest is frozen:
      # the working tree must match migrations/meta/manifest.json (the Deno
      # suite proves that) and, against the base ref, migrations/ may only
      # gain files. See scripts/check-migration-freeze.mjs (header).
      - name: Check migration freeze (manifest + additions only)
        run: |
          pnpm run check:migration-freeze
          pnpm run check:migration-additions -- "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

      # Fails when a *.test.ts is claimed by no runner -- such a suite never
      # executes and never reaches coverage/lcov.info, so it reads as tested
      # in review while contributing nothing.
      - name: Check test inventory (every suite runs somewhere)
        run: pnpm run check:test-inventory

      - name: Check third-party notices
        run: pnpm run notices:check

      - name: Install osv-scanner
        run: |
          curl -sSfL --proto "=https" --proto-redir "=https" --retry 3 --retry-connrefused --retry-delay 2 -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  /usr/local/bin/osv-scanner" | sha256sum -c -
          chmod +x /usr/local/bin/osv-scanner

      - name: Dependency vulnerability scan (osv-scanner)
        run: osv-scanner scan source --recursive .

      - name: Check CA boundary (Organization CA must not touch Platform CA paths)
        run: pnpm run check:ca-boundary

      - name: Check import boundaries
        run: pnpm run check:import-boundaries

      - name: Check contract drift (skip when turbopaneld is not a sibling)
        run: pnpm run check:contract-drift

  vitest:
    name: vitest
    runs-on: ubuntu-latest
    # A Workers-pool process that never exits used to sit until GitHub's
    # 6-hour default. The measured run is about a minute and a half.
    timeout-minutes: 15
    concurrency:
      group: instance-vitest-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: turbopanel
          POSTGRES_PASSWORD: turbopanel_ci_test
          POSTGRES_DB: turbopanel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turbopanel -d turbopanel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TURBOPANEL_DATABASE_URL: postgresql://turbopanel:turbopanel_ci_test@127.0.0.1:5432/turbopanel
      TEST_PHASE: vitest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Apply database migrations
        run: pnpm migrate

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload Vitest LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-vitest
          path: coverage/vitest/lcov.info
          if-no-files-found: error
          retention-days: 1

  deno-hostfree:
    name: deno hostfree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: instance-deno-hostfree-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      TEST_PHASE: deno
      DENO_SHARD: hostfree
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload Deno LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-deno-hostfree
          path: coverage/deno.lcov
          if-no-files-found: error
          retention-days: 1

  deno-db:
    name: deno ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # api-routes alone is the long file. The budget used to be 45 minutes
    # for the whole suite on one runner.
    timeout-minutes: 15
    concurrency:
      group: instance-deno-${{ matrix.shard }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: [api-routes, db-1, db-2]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: turbopanel
          POSTGRES_PASSWORD: turbopanel_ci_test
          POSTGRES_DB: turbopanel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turbopanel -d turbopanel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TURBOPANEL_DATABASE_URL: postgresql://turbopanel:turbopanel_ci_test@127.0.0.1:5432/turbopanel
      TEST_PHASE: deno
      DENO_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Apply database migrations
        run: pnpm migrate

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload Deno LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-deno-${{ matrix.shard }}
          path: coverage/deno.lcov
          if-no-files-found: error
          retention-days: 1

  sonarqube:
    name: SonarQube
    needs: [checks, vitest, deno-hostfree, deno-db]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: instance-sonar-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Fail unless every upstream job succeeded
        run: echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Require SONAR_TOKEN
        # Fork PRs and Dependabot PRs cannot receive repository secrets — GitHub
        # withholds them from the dependabot[bot] actor even on same-repo
        # branches — so the require is skipped there and the rest of the chain
        # still gates; the scan below then skips on the empty token. Every other
        # trigger (trunk pushes, same-repo PRs, workflow_call) must have it.
        if: >-
          github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing — add the secret on TurboPanel/turbopanel (or org)."
            exit 1
          fi

      - name: Download shard LCOV
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lcov-*
          path: coverage/parts
          # Each shard uploads a file named deno.lcov. Separate directories
          # keep those from overwriting each other.
          merge-multiple: false

      - name: Merge shard LCOV
        run: |
          find coverage/parts -type f | sort
          python3 scripts/merge-lcov.py --parts coverage/parts --out coverage/lcov.info --assert-workers

      - name: Upload coverage LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instance-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: SonarQube Scan
        # Skipped only when SONAR_TOKEN is empty (fork or Dependabot PR).
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # ClickHouse/Tabix metrics infrastructure is retired (DuckDB + Parquet /
  # Analytics Engine replaced it). The guard lives in TurboPanel/turbopaneld
  # (scripts/check-metrics-legacy.ts) and scans sibling checkouts when present,
  # so check this repo out next to it — a clean single-repo turbopaneld CI run
  # cannot see PRs made here.
  metrics-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: instance-metrics-legacy-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: turbopanel

      - name: Check out turbopaneld (metrics-legacy guard)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurboPanel/turbopaneld
          path: turbopaneld

      - name: Read Deno pin
        id: deno-pin
        run: echo "version=$(sh turbopanel/scripts/ci-runtime-pins.sh turbopaneld deno)" >> "$GITHUB_OUTPUT"

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.deno-pin.outputs.version }}

      - name: Check metrics legacy (no ClickHouse/Tabix references)
        working-directory: turbopaneld
        run: deno task check:metrics-legacy

      - name: Check metrics contract twin (sibling byte-compare)
        working-directory: turbopanel
        run: deno test -A --no-check src/contracts/metrics-contract.test.ts

      - name: Check contract drift (metrics, hostname, machine-key, channels)
        working-directory: turbopanel
        run: node scripts/check-contract-drift.mjs
