name: Build

on:
  push:
    branches:
      - trunk
  pull_request:
    types: [opened, synchronize, reopened]
  # Manual re-run for a trunk push GitHub failed to deliver (2026-09-28: the
  # 0.1.2 bump merge produced no run, so no canary followed).
  workflow_dispatch:

permissions:
  contents: read

# Tests fan out, then one job named SonarQube merges LCOV and, on a pull
# request, scans and waits for the quality gate. It runs when every coverage
# shard succeeded and is skipped otherwise (the failing shard is already red on
# its own job and in ci-ok, so Sonar does not repeat that red).
#
# On a trunk push (or a manual run) the job only merges and uploads the LCOV;
# the trunk analysis (the baseline PRs are compared against) runs in
# sonar-trunk.yml after Build completes, next to the canary instead of in
# front of it. The security engine takes ~10 minutes over the whole program on
# every full analysis, and Canary starts only when Build completes.
#
# Concurrency. On a pull request a new push replaces the run already going
# (cancel-in-progress), as before. On a trunk push nothing is cancelled: every
# merged commit is tested and can get its canary, so a newer merge waits for
# the older run instead of killing it (a killed run left that commit untested
# and without a canary). The workflow-level group queues trunk runs in push
# order (`queue: max`, up to 100 pending; the default `single` would cancel a
# pending run when a third arrives). `queue: max` cannot be combined with
# cancel-in-progress set to true, hence the per-event expressions. Each job
# keeps its own group too; one shared job group would queue the shards behind
# each other.
# The trunk -> staging and staging -> live promotion PRs are the exception: a
# merge moves their head every few minutes, and cancelling the run on the old
# head left a cancelled (red) mark on that trunk commit. Their groups end in the
# run id, so every head gets its own run and nothing is cancelled.
concurrency:
  group: instance-build-${{ github.event_name }}-${{ (github.head_ref == 'trunk' || github.head_ref == 'staging') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'trunk' && github.head_ref != 'staging' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: instance-checks-${{ github.event_name }}-${{ (github.head_ref == 'trunk' || github.head_ref == 'staging') && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'trunk' && github.head_ref != 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-migration-additions runs `git show <base>:migrations/manifest.json`.
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Durable Object hibernation guard
        run: pnpm run check:do-hibernation

      - name: Workers bundle check
        run: pnpm run check:workers-bundle

      # Type-checks the Workers graph (src/workers.ts and what it imports)
      # against the generated Cloudflare bindings; `deno check` cannot load
      # @cloudflare/workers-types. The Deno half is the `typecheck` job.
      - name: Workers typecheck (tsc)
        run: pnpm run check:workers-types

      - name: Lint (deno lint)
        run: deno lint

      # Prettier (.prettierrc) is canonical, but most of the tree predates the
      # gate, so only files this change adds or modifies are checked.
      - name: Format check (changed files, Prettier)
        run: sh scripts/check-format-changed.sh "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

      - name: Secret scan (every tracked file)
        run: sh scripts/scan-secrets.sh --all

      # The commits a PR adds, not just its final tree: a secret committed and
      # removed again inside the PR still sits in the history that gets merged.
      # PRs into staging/live carry trunk commits that were already scanned on
      # their own PRs, so only PRs into trunk are scanned by range.
      - name: Scan pull request commits for secrets
        if: github.event_name == 'pull_request' && github.base_ref == 'trunk'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/scan-secrets.sh --range "$BASE_SHA..$HEAD_SHA"

      - name: Secret scanner self-test
        run: sh scripts/scan-secrets.selftest.sh

      - name: Check vocabulary (no daemon-as-agent phrasing)
        run: pnpm run check:vocabulary

      # Shipped migrations are immutable once the freeze manifest is frozen:
      # the working tree must match migrations/meta/manifest.json (the Deno
      # suite proves that) and, against the base ref, migrations/ may only
      # gain files. See scripts/check-migration-freeze.mjs (header).
      - name: Check migration freeze (manifest + additions only)
        run: |
          pnpm run check:migration-freeze
          pnpm run check:migration-additions -- "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          pnpm run check:migration-forward-only -- "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

      # Fails when a *.test.ts is claimed by no runner -- such a suite never
      # executes and never reaches coverage/lcov.info, so it reads as tested
      # in review while contributing nothing.
      - name: Check test inventory (every suite runs somewhere)
        run: pnpm run check:test-inventory

      - name: Check third-party notices
        run: pnpm run notices:check

      # Dependency Advisory Gate (TurboPanel/dev): fails only on a HIGH or
      # CRITICAL advisory that already has a fixed version; everything else is
      # a warning annotation. Override for one verified not exploitable here:
      # an [[IgnoredVulns]] entry with a reason in osv-scanner.toml.
      - name: Dependency advisory gate (osv-scanner)
        uses: TurboPanel/dev/.github/actions/osv-scan@8512d65091c662383a4aa6ff2848e16230ccc5e1 # dev#55

      - name: Check CA boundary (Organization CA must not touch Platform CA paths)
        run: pnpm run check:ca-boundary

      - name: Check instance ACME boundary (instance ACME must not touch organization ACME)
        run: pnpm run check:instance-acme-boundary

      - name: Check import boundaries
        run: pnpm run check:import-boundaries

      - name: Check metrics boundaries (AE tokens and page identity stay backend-private)
        run: pnpm run check:metrics-boundaries

      - name: Check contract drift (skip when turbopaneld is not a sibling)
        run: pnpm run check:contract-drift

  vitest:
    name: vitest
    runs-on: ubuntu-latest
    # A Workers-pool process that never exits used to sit until GitHub's
    # 6-hour default. The measured run is about a minute and a half.
    timeout-minutes: 15
    concurrency:
      group: instance-vitest-${{ github.event_name }}-${{ (github.head_ref == 'trunk' || github.head_ref == 'staging') && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'trunk' && github.head_ref != 'staging' }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: turbopanel
          POSTGRES_PASSWORD: turbopanel_ci_test
          POSTGRES_DB: turbopanel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turbopanel -d turbopanel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TURBOPANEL_DATABASE_URL: postgresql://turbopanel:turbopanel_ci_test@127.0.0.1:5432/turbopanel
      TEST_PHASE: vitest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Apply database migrations
        run: pnpm migrate

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload Vitest LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-vitest
          path: coverage/vitest/lcov.info
          if-no-files-found: error
          retention-days: 1

  deno-hostfree:
    name: deno hostfree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: instance-deno-hostfree-${{ github.event_name }}-${{ (github.head_ref == 'trunk' || github.head_ref == 'staging') && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'trunk' && github.head_ref != 'staging' }}
    env:
      TEST_PHASE: deno
      DENO_SHARD: hostfree
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload Deno LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-deno-hostfree
          path: coverage/deno.lcov
          if-no-files-found: error
          retention-days: 1

  deno-db:
    name: deno ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # api-routes alone is the long file. The budget used to be 45 minutes
    # for the whole suite on one runner.
    timeout-minutes: 15
    concurrency:
      group: instance-deno-${{ matrix.shard }}-${{ github.event_name }}-${{ (github.head_ref == 'trunk' || github.head_ref == 'staging') && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'trunk' && github.head_ref != 'staging' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [api-routes, db-1, db-2]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: turbopanel
          POSTGRES_PASSWORD: turbopanel_ci_test
          POSTGRES_DB: turbopanel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turbopanel -d turbopanel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TURBOPANEL_DATABASE_URL: postgresql://turbopanel:turbopanel_ci_test@127.0.0.1:5432/turbopanel
      # A suite that cannot see the database throws instead of skipping.
      TURBOPANEL_REQUIRE_DB: '1'
      TEST_PHASE: deno
      DENO_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Apply database migrations
        run: pnpm migrate

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload Deno LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-deno-${{ matrix.shard }}
          path: coverage/deno.lcov
          if-no-files-found: error
          retention-days: 1

  # The daemon-cell suites talk to Redis over a unix socket, so the container
  # shares a host directory and serves the socket there. They are outside the
  # coverage shards (no LCOV) and fail, not skip, when the socket is missing.
  deno-redis:
    name: deno redis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: instance-deno-redis-${{ github.event_name }}-${{ (github.head_ref == 'trunk' || github.head_ref == 'staging') && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'trunk' && github.head_ref != 'staging' }}
    env:
      TURBOPANEL_REDIS_SOCKET: /tmp/tp-redis/redis.sock
      TURBOPANEL_REQUIRE_REDIS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Start Redis on a unix socket
        run: |
          mkdir -p /tmp/tp-redis
          chmod 777 /tmp/tp-redis
          docker run -d --name tp-redis -v /tmp/tp-redis:/tmp/tp-redis redis:7-alpine \
            redis-server --port 0 --unixsocket "$TURBOPANEL_REDIS_SOCKET" --unixsocketperm 777
          for _ in $(seq 1 30); do
            [ -S "$TURBOPANEL_REDIS_SOCKET" ] && exit 0
            sleep 1
          done
          docker logs tp-redis
          echo "::error::Redis socket never appeared"
          exit 1

      - name: Test the Redis daemon-cell suites
        run: deno test -A --no-check src/daemon/redis-cell.test.ts src/daemon/ws-handlers.test.ts

  # Test shards run with --no-check for speed, so this job is what type-checks
  # the Deno surface (entry points and every Deno test file).
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: instance-typecheck-${{ github.event_name }}-${{ (github.head_ref == 'trunk' || github.head_ref == 'staging') && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'trunk' && github.head_ref != 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Deno typecheck (entry points + tests)
        run: deno task check:types

  # Skipped, not failed, when a coverage shard did not succeed: the scan needs
  # every shard's LCOV, and that shard's failure is already reported once.
  sonarqube:
    name: SonarQube
    needs: [vitest, deno-hostfree, deno-db]
    if: >-
      ${{ !cancelled()
      && needs.vitest.result == 'success'
      && needs.deno-hostfree.result == 'success'
      && needs.deno-db.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: instance-sonar-${{ github.event_name }}-${{ (github.head_ref == 'trunk' || github.head_ref == 'staging') && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'trunk' && github.head_ref != 'staging' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Require SONAR_TOKEN
        # Fork PRs and Dependabot PRs cannot receive repository secrets — GitHub
        # withholds them from the dependabot[bot] actor even on same-repo
        # branches — so the require is skipped there and the rest of the chain
        # still gates; the scan below then skips on the empty token. Every other
        # trigger (trunk pushes, same-repo PRs, workflow_call) must have it.
        if: >-
          github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing — add the secret on TurboPanel/turbopanel (or org)."
            exit 1
          fi

      - name: Download shard LCOV
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lcov-*
          path: coverage/parts
          # Each shard uploads a file named deno.lcov. Separate directories
          # keep those from overwriting each other.
          merge-multiple: false

      - name: Merge shard LCOV
        run: |
          find coverage/parts -type f | sort
          python3 scripts/merge-lcov.py --parts coverage/parts --out coverage/lcov.info --assert-workers

      - name: Upload coverage LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instance-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: SonarQube Scan
        id: sonar
        # Pull requests only; the quality gate blocks pull requests only. A
        # trunk push is analysed by sonar-trunk.yml after Build completes, from
        # the instance-coverage-lcov artifact uploaded above, so the scan does
        # not hold back the canary.
        #
        # Also skipped when SONAR_TOKEN is empty (fork or Dependabot PR) and on
        # the automatic promotion PRs into staging/live, which carry only
        # commits already analysed on trunk (no new code to gate).
        if: >-
          env.SONAR_TOKEN != ''
          && github.event_name == 'pull_request'
          && github.base_ref != 'staging'
          && github.base_ref != 'live'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      # The Sonar way gate fails only on ratings, so one new code smell passes
      # it; this fails the PR on any new issue (owner rule, 2026-09-30). Runs
      # only where the PR scan above ran, so it skips the promotion PRs too.
      - name: No new Sonar issues
        if: github.event_name == 'pull_request' && steps.sonar.outcome == 'success'
        uses: TurboPanel/dev/.github/actions/sonar-new-issues@2db1bbfa3cff89a52fac3ee4a53bd495dc1c79b1 # dev#47

  # Contract twin: byte-compares the metrics contract and the other mirrored
  # contracts against TurboPanel/turbopaneld, so this repo is checked out next
  # to a sibling turbopaneld checkout (a same-named branch, else trunk).
  contract-twin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: instance-contract-twin-${{ github.event_name }}-${{ (github.head_ref == 'trunk' || github.head_ref == 'staging') && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'trunk' && github.head_ref != 'staging' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: turbopanel

      - name: Resolve turbopaneld checkout ref
        id: daemon-ref
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # A same-named feature branch, else the sibling's trunk. Never the
          # sibling's staging or live: promotion PRs (base staging/live) and
          # PRs from those branches carry commits that passed against trunk.
          REF="$HEAD_REF"
          case "$REF:$BASE_REF" in
            staging:* | live:* | *:staging | *:live) REF=trunk ;;
            *) ;;
          esac
          if gh api "repos/TurboPanel/turbopaneld/branches/${REF}" --silent; then
            echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=trunk" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out turbopaneld (contract twin sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurboPanel/turbopaneld
          path: turbopaneld
          ref: ${{ steps.daemon-ref.outputs.ref }}

      - name: Read Deno pin
        id: deno-pin
        run: echo "version=$(sh turbopanel/scripts/ci-runtime-pins.sh turbopaneld deno)" >> "$GITHUB_OUTPUT"

      # Three attempts, 15 s then 45 s apart: setup-deno has no retry input and
      # a transient GitHub 5xx on the download must not turn the run red.
      - name: Install Deno
        id: deno-try-1
        continue-on-error: true
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.deno-pin.outputs.version }}
      - name: Wait before retrying the Deno download
        if: steps.deno-try-1.outcome == 'failure'
        run: sleep 15
      - name: Install Deno (retry 1 of 2)
        id: deno-try-2
        if: steps.deno-try-1.outcome == 'failure'
        continue-on-error: true
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.deno-pin.outputs.version }}
      - name: Wait before retrying the Deno download again
        if: steps.deno-try-2.outcome == 'failure'
        run: sleep 45
      - name: Install Deno (retry 2 of 2)
        if: steps.deno-try-2.outcome == 'failure'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.deno-pin.outputs.version }}

      - name: Check metrics contract twin (sibling byte-compare)
        working-directory: turbopanel
        run: deno test -A --no-check src/contracts/metrics-contract.test.ts

      - name: Check contract drift (metrics, hostname, machine-key, channels)
        working-directory: turbopanel
        run: node scripts/check-contract-drift.mjs

  # Single aggregate check for the branch rulesets. It needs every job that
  # runs on pull_request and fails unless all of them succeeded (a skipped
  # need is a failure too — SonarQube is skipped only when a coverage shard
  # did not succeed). Required-check contexts move from the individual job
  # names to this one context so a job rename or a new job never blocks merges
  # on a name the ruleset still waits for.
  #
  # Cancelled runs: on a pull request a cancelled need still fails ci-ok (the
  # PR must not merge on an incomplete run). On a trunk push (or a manual
  # run) a cancelled need skips ci-ok instead, so the run reads as
  # cancelled, not failed. The jobs have job-level concurrency groups, so a
  # need can be cancelled while the run itself is not — `!cancelled()` alone
  # would still turn ci-ok red.
  ci-ok:
    name: ci-ok
    needs: [checks, typecheck, vitest, deno-hostfree, deno-db, deno-redis, sonarqube, contract-twin]
    if: >-
      ${{ (github.event_name == 'pull_request' && always())
      || (!cancelled() && !contains(needs.*.result, 'cancelled')) }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: instance-ci-ok-${{ github.event_name }}-${{ (github.head_ref == 'trunk' || github.head_ref == 'staging') && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'trunk' && github.head_ref != 'staging' }}
    steps:
      - name: Fail unless every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null
