# Canary: after every green Build on trunk, build the self-hosted instance
# from that exact commit and publish it to the rolling `canary` pre-release
# (Road to 0.1.x, `trunk-canary`). The build itself is release.yml's —
# called here with channel=canary — so a canary package is bit-for-bit the
# shape a release package has, only versioned <X.Y.Z>-canary.<buildId> and
# replaced on the next merge instead of pinned to a tag.
#
# workflow_run (not push) so the compile never starts before the test suite
# has passed on the commit; cancel-in-progress so a burst of merges only
# ever publishes the newest one.

name: Canary

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [trunk]

permissions:
  contents: write
  actions: read

concurrency:
  group: canary
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'trunk'
    uses: ./.github/workflows/release.yml
    with:
      channel: canary
      ref: ${{ github.event.workflow_run.head_sha }}
    # The manifest is signed in the called workflow; a called workflow sees
    # only the secrets it is handed.
    secrets:
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
