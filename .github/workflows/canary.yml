# Canary: after every green Build on trunk, build the self-hosted instance
# from that exact commit and publish it to the rolling `canary` pre-release
# (Road to 0.1.x, `trunk-canary`). The build itself is release.yml's —
# called here with channel=canary — so a canary package is bit-for-bit the
# shape a release package has, only versioned <X.Y.Z>-canary.<N> (from tags) and
# replaced on the next merge instead of pinned to a tag.
#
# workflow_run (not push) so the compile never starts before the test suite
# has passed on the commit. Canaries are never cancelled or dropped: every
# green trunk commit gets its own (publish-rc.yml waits for the canary of the
# exact commit a Release Candidate PR merged). Runs queue in order
# (`queue: max`; the default `single` would cancel a pending one when a third
# arrives, and `queue: max` cannot be combined with cancel-in-progress).
#
# Only a Build that tested the trunk commit itself counts: a push to trunk,
# or a manual Build run (workflow_dispatch, for a trunk push GitHub failed to
# deliver). A pull_request Build is excluded even when its head branch is
# trunk — the trunk -> staging "Release Candidate" PR's run tests trunk
# merged into staging, not the trunk commit. A run whose job is skipped (a PR
# Build, a red Build) waits its turn in the queue and ends at once; with
# cancel-in-progress off it can no longer cancel a canary being published.

name: Canary

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [trunk]

# Nothing by default; the one job below asks for what the release build needs.
permissions: {}

concurrency:
  group: canary
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'trunk'
      && (github.event.workflow_run.event == 'push'
          || github.event.workflow_run.event == 'workflow_dispatch')
    # contents: write — gh-canary.yml uploads to the rolling `canary`
    # release and moves its tag. actions: read — release.yml's prepare job
    # looks up the green Build run for the commit.
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      channel: canary
      ref: ${{ github.event.workflow_run.head_sha }}
    # The manifest is signed in the called workflow; a called workflow sees
    # only the secrets it is handed.
    secrets:
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
