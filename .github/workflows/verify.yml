name: Verify

on:
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: instance-verify-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: turbopanel
          POSTGRES_PASSWORD: turbopanel_ci_test
          POSTGRES_DB: turbopanel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turbopanel -d turbopanel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TURBOPANEL_DATABASE_URL: postgresql://turbopanel:turbopanel_ci_test@127.0.0.1:5432/turbopanel
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.17.0"
          cache: pnpm

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.4"
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply database migrations
        run: pnpm migrate

      - name: Pre-commit validation suite
        run: pnpm run test:hook
