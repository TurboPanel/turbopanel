name: Setup instance toolchain
description: Install pinned pnpm, Node, and Deno, then a frozen pnpm install.

runs:
  using: composite
  steps:
    # Node and Deno versions are the daemon role defaults (node_version /
    # deno_version). dev paths.sh and run.sh are tested against those files,
    # so this action reads them instead of copying the numbers. The ref is a
    # commit SHA, not `trunk`: a moving ref would change the compiler used for an
    # already-merged instance commit with no change in this repo. To move to
    # new versions, bump the SHA in a PR here (scripts/ci-runtime-pins.test.ts
    # requires a full 40-character SHA).
    - name: Check out runtime pins
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: TurboPanel/turbopaneld
        ref: 31210187aaf462199967dbd1e6bf3ccff69fa6b5 # TurboPanel/turbopaneld trunk, 2026-10-04
        fetch-depth: 1
        path: .ci-toolchain-pins
        persist-credentials: false
        sparse-checkout: |
          orchestration/roles/node-runtime/defaults
          orchestration/roles/deno-runtime/defaults

    - name: Read runtime pins
      id: pins
      shell: bash
      run: |
        root="${GITHUB_WORKSPACE}/.ci-toolchain-pins"
        node_version=$(sh scripts/ci-runtime-pins.sh "$root" node)
        deno_version=$(sh scripts/ci-runtime-pins.sh "$root" deno)
        echo "node-version=${node_version}" >> "$GITHUB_OUTPUT"
        echo "deno-version=${deno_version}" >> "$GITHUB_OUTPUT"
        rm -rf "$root"

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.pins.outputs.node-version }}
        cache: pnpm

    # Three attempts, 15 s then 45 s apart: setup-deno has no retry input and
    # a transient GitHub 5xx on the download must not turn the run red.
    - name: Install Deno
      id: deno-try-1
      continue-on-error: true
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: ${{ steps.pins.outputs.deno-version }}
        cache: true
    - name: Wait before retrying the Deno download
      if: steps.deno-try-1.outcome == 'failure'
      shell: bash
      run: sleep 15
    - name: Install Deno (retry 1 of 2)
      id: deno-try-2
      if: steps.deno-try-1.outcome == 'failure'
      continue-on-error: true
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: ${{ steps.pins.outputs.deno-version }}
        cache: true
    - name: Wait before retrying the Deno download again
      if: steps.deno-try-2.outcome == 'failure'
      shell: bash
      run: sleep 45
    - name: Install Deno (retry 2 of 2)
      if: steps.deno-try-2.outcome == 'failure'
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: ${{ steps.pins.outputs.deno-version }}
        cache: true

    - name: Install dependencies
      # BYONM: deno task compile bundles duckdb.node from this pnpm tree.
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
